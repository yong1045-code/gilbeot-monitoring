name: Build Gilbeot Monitoring APK v2.19

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Gilbeot-project-v2.19.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore Android project v2.19
        run: |
          base64 -d Gilbeot-project-v2.19.txt > project.zip
          unzip -q project.zip
          cp -a gilbeot-monitoring-v2.19/. .

      - name: Verify v2.19 session-expiry alerts, sync and deletion features
        run: |
          grep -q 'versionCode = 219' app/build.gradle.kts
          grep -q 'versionName = "2.19"' app/build.gradle.kts
          grep -q 'const val VERSION = "2.19"' app/src/main/java/com/gilbeot/monitoring/BuildInfo.kt
          grep -q 'markNaverSessionExpired' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorState.kt
          grep -q 'notifyNaverSessionExpired' app/src/main/java/com/gilbeot/monitoring/monitor/IssueNotifier.kt
          grep -q '세션 만료 · 네이버 재로그인 필요' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorService.kt
          grep -q '네이버 로그인 세션이 만료되었습니다' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q '네이버 다시 로그인' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q 'isNaverSessionExpired' app/src/main/java/com/gilbeot/monitoring/MainActivity.kt
          grep -q '회차당 상세는 최대 12개' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q '회차당 상세는 최대 28개' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q 'v2.19는 신규글을 발견한 회차에 글자 본문을 먼저 저장' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q 'https://imosbavhizihxxlkxoci.supabase.co' app/build.gradle.kts
          grep -q 'sb_publishable_' app/build.gradle.kts
          grep -q 'AUTO_SYNC_INTERVAL_MS = 3L \* 60L \* 60_000L' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'realtime/v1/websocket' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'postgres_changes' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'gilbeot_device_snapshots' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'snapshot_hash' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q '다른 기기 변경은 실시간 반영' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'cloudSyncImmediately' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'force = result.cloudSyncImmediately' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorService.kt
          grep -q 'onAppOpened' app/src/main/java/com/gilbeot/monitoring/MainActivity.kt
          grep -q 'supabase_realtime' SUPABASE_SETUP.sql
          grep -q '기록 삭제' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q 'sync_tombstones' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'val recentListReliable = recent.size >= 80' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'gilbeotmonitor' app/src/main/AndroidManifest.xml
          ! grep -R -q 'GoogleDriveSyncManager\|DRIVE_APPFOLDER\|appDataFolder' app/src/main/java
          ! grep -R -q '사진작업하는곳\|priorityBoard\|우선게시판' app/src/main/java
          # Crash regression: never call toHttpUrl() on ws/wss URL.
          grep -q '"${supabaseUrl()}/realtime/v1/websocket".toHttpUrl()' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          ! grep -q 'replaceFirst("https://", "wss://")' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'Realtime 연결 준비 실패' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          # v2.19: keep v2.18 low-data scheduling while fixing body preservation.
          grep -q 'broadScanIntervalMs' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorPreferences.kt
          grep -q 'if (dataOptimized) 15L \* 60L \* 1000L else 5L \* 60L \* 1000L' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorPreferences.kt
          grep -q 'if (dataOptimized) 10L \* 60L \* 1000L else 3L \* 60L \* 1000L' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorPreferences.kt
          grep -q 'newBodyRetryIntervalMs' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorPreferences.kt
          grep -q 'if (dataOptimized) 5L \* 60L \* 1000L else 2L \* 60L \* 1000L' app/src/main/java/com/gilbeot/monitoring/monitor/MonitorPreferences.kt
          grep -q 'maxDetailTargets = if (dataOptimized) 12 else 28' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'sweepCount = if (dataOptimized) 2 else 6' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'immediateBodyLimit = if (dataOptimized) 6 else 12' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'fetchArticleBodyForStorage' app/src/main/java/com/gilbeot/monitoring/monitor/NaverCafeDataSource.kt
          grep -q 'recentArticlesMissingBody' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'storeArticleBodyIfMissing' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'articleHasStoredBody' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'fetchBody = !store.articleHasStoredBody' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'store.markArticleDetailSeen(slug, articleId, detail.comments.size, detail.bodyText, now)' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'if (bodyText != null) put("body_text", bodyText)' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'body_text IS NOT NULL' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'body_text IS NULL' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q '본문저장완료' app/src/main/java/com/gilbeot/monitoring/monitor/NaverCafeDataSource.kt
          grep -q 'v2.19는 신규글을 발견한 회차에 글자 본문을 먼저 저장' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q 'ORDER BY CASE WHEN body_text IS NULL THEN 0 ELSE 1 END, last_detail_at ASC' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'registerArticleMiss' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q 'registerCommentMiss' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          # Timestamp comparisons must be numeric: SQLite binds rawQuery arguments as TEXT.
          python3 - <<'PYSQL'
          from pathlib import Path
          import re, sqlite3
          source=Path('app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt').read_text()
          assert len(re.findall(r'COALESCE\([^\n]*?\)(?:>=|<=)CAST\(\? AS INTEGER\)', source))==6
          assert not re.search(r'COALESCE\([^\n]*?\)(?:>=|<=)\?', source)
          db=sqlite3.connect(':memory:')
          db.execute('create table articles(cafe_slug text, deleted_at integer, remote_deleted_at integer, record_removed_at integer)')
          db.execute('create table comments(cafe_slug text, deleted_at integer, remote_deleted_at integer, record_removed_at integer, deleted_because_article_gone integer)')
          now=1790878697000; start=1790800000000
          db.executemany('insert into articles values(?,?,?,?)',[('roadclubs',now,None,None),('roadclubs',None,now,None),('roadclubs',now,None,now)])
          db.executemany('insert into comments values(?,?,?,?,?)',[('roadclubs',now,None,None,0),('roadclubs',None,now,None,0),('roadclubs',now,None,now,0)])
          qa='select count(*) from articles where cafe_slug=? and coalesce(remote_deleted_at,deleted_at)>=CAST(? AS INTEGER) and record_removed_at is null'
          qc='select count(*) from comments where cafe_slug=? and coalesce(remote_deleted_at,case when deleted_at is not null and deleted_because_article_gone=0 then deleted_at end)>=CAST(? AS INTEGER) and record_removed_at is null'
          assert db.execute(qa,('roadclubs',str(start))).fetchone()[0]==2
          assert db.execute(qc,('roadclubs',str(start))).fetchone()[0]==2
          print('v2.19 SQLite deletion counts: PASS')

          # v2.19 fixed-size maintenance detail sweep still prioritizes missing bodies.
          db.execute('create table body_articles(cafe_slug text, article_id integer, deleted_at integer, body_text text, created_at integer, last_detail_at integer)')
          minute=60_000; day=86_400_000
          rows=[
              ('roadclubs',1,None,None,now-5*minute,now-1*minute),
              ('roadclubs',2,None,'본문있음',now-4*minute,0),
              ('roadclubs',3,None,None,now-40*minute,now-2*minute),
              ('roadclubs',4,None,'',now-3*minute,0),
          ]
          db.executemany('insert into body_articles values(?,?,?,?,?,?)',rows)
          cutoff=now-90*day
          qs="""select article_id from body_articles where cafe_slug=? and deleted_at is null and created_at>=? order by case when body_text is null then 0 else 1 end, last_detail_at asc, article_id desc limit ?"""
          got=[r[0] for r in db.execute(qs,('roadclubs',cutoff,2))]
          assert set(got)=={1,3}, got
          print('v2.19 maintenance detail-sweep body priority: PASS')

          # v2.19 recent-body retry query: NULL only; empty string is already stored.
          db.execute('create table retry_articles(cafe_slug text, article_id integer, deleted_at integer, is_baseline integer, body_text text, first_seen_at integer, created_at integer)')
          rows=[
              ('roadclubs',10,None,0,None,now-5*minute,now-5*minute),
              ('roadclubs',11,None,0,'',now-4*minute,now-4*minute),
              ('roadclubs',12,None,0,'본문',now-3*minute,now-3*minute),
              ('roadclubs',13,None,1,None,now-2*minute,now-2*minute),
              ('roadclubs',14,now,0,None,now-1*minute,now-1*minute),
          ]
          db.executemany('insert into retry_articles values(?,?,?,?,?,?,?)',rows)
          qr="""select article_id from retry_articles where cafe_slug=? and deleted_at is null and is_baseline=0 and body_text is null and first_seen_at>=? and (created_at<=0 or created_at>=?) order by first_seen_at asc, article_id asc limit ?"""
          got=[r[0] for r in db.execute(qr,('roadclubs',now-30*minute,now-6*60*minute,10))]
          assert got==[10], got
          print('v2.19 limited new-body retry SQL: PASS')
          PYSQL
          echo 'v2.19 static feature checks passed'

      - name: Restore permanent signing key
        env:
          GILBEOT_KEYSTORE_BASE64: ${{ secrets.GILBEOT_KEYSTORE_BASE64 }}
          GILBEOT_STORE_PASSWORD: ${{ secrets.GILBEOT_STORE_PASSWORD }}
          GILBEOT_KEY_ALIAS: ${{ secrets.GILBEOT_KEY_ALIAS }}
          GILBEOT_KEY_PASSWORD: ${{ secrets.GILBEOT_KEY_PASSWORD }}
        run: |
          test -n "$GILBEOT_KEYSTORE_BASE64" || (echo "Missing GILBEOT_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$GILBEOT_STORE_PASSWORD" || (echo "Missing GILBEOT_STORE_PASSWORD secret" && exit 1)
          test -n "$GILBEOT_KEY_ALIAS" || (echo "Missing GILBEOT_KEY_ALIAS secret" && exit 1)
          test -n "$GILBEOT_KEY_PASSWORD" || (echo "Missing GILBEOT_KEY_PASSWORD secret" && exit 1)
          echo "$GILBEOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gilbeot-release-key.jks"
          echo "GILBEOT_KEYSTORE_PATH=$RUNNER_TEMP/gilbeot-release-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK v2.19
        env:
          GILBEOT_STORE_PASSWORD: ${{ secrets.GILBEOT_STORE_PASSWORD }}
          GILBEOT_KEY_ALIAS: ${{ secrets.GILBEOT_KEY_ALIAS }}
          GILBEOT_KEY_PASSWORD: ${{ secrets.GILBEOT_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/길벗모니터링-v2.19.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilbeot-monitoring-v2.19-apk
          path: app/build/outputs/apk/release/길벗모니터링-v2.19.apk
          if-no-files-found: error
