name: Build Gilbeot Monitoring APK v1.42

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Gilbeot-project-v1.42.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore Android project v1.42
        run: |
          base64 -d Gilbeot-project-v1.42.txt > project.zip
          unzip -q project.zip
          cp -a gilbeot-monitoring-v1.42/. .

      - name: Verify v1.42 metadata and cross-check deletion logic
        run: |
          grep -q 'versionCode = 142' app/build.gradle.kts
          grep -q 'versionName = "1.42"' app/build.gradle.kts
          grep -q 'const val VERSION = "1.42"' app/src/main/java/com/gilbeot/monitoring/BuildInfo.kt
          grep -q 'newArticlesForDeletionWatch' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'fetchBoardPresenceSnapshot' app/src/main/java/com/gilbeot/monitoring/monitor/NaverCafeDataSource.kt
          grep -q 'probeArticlePage' app/src/main/java/com/gilbeot/monitoring/monitor/NaverCafeDataSource.kt
          grep -q '신규글교차검증' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          grep -q '존재응답충돌' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          ! grep -R -q '사진작업하는곳\|priorityBoard\|fetchNamedBoardActivityScan\|NamedBoardScanResult\|우선게시판' app/src/main/java
          echo 'v1.42 metadata/cross-check deletion verification passed'

      - name: Restore permanent signing key
        env:
          GILBEOT_KEYSTORE_BASE64: ${{ secrets.GILBEOT_KEYSTORE_BASE64 }}
          GILBEOT_STORE_PASSWORD: ${{ secrets.GILBEOT_STORE_PASSWORD }}
          GILBEOT_KEY_ALIAS: ${{ secrets.GILBEOT_KEY_ALIAS }}
          GILBEOT_KEY_PASSWORD: ${{ secrets.GILBEOT_KEY_PASSWORD }}
        run: |
          test -n "$GILBEOT_KEYSTORE_BASE64" || (echo "Missing GILBEOT_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$GILBEOT_STORE_PASSWORD" || (echo "Missing GILBEOT_STORE_PASSWORD secret" && exit 1)
          test -n "$GILBEOT_KEY_ALIAS" || (echo "Missing GILBEOT_KEY_ALIAS secret" && exit 1)
          test -n "$GILBEOT_KEY_PASSWORD" || (echo "Missing GILBEOT_KEY_PASSWORD secret" && exit 1)
          echo "$GILBEOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gilbeot-release-key.jks"
          echo "GILBEOT_KEYSTORE_PATH=$RUNNER_TEMP/gilbeot-release-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK v1.42
        env:
          GILBEOT_STORE_PASSWORD: ${{ secrets.GILBEOT_STORE_PASSWORD }}
          GILBEOT_KEY_ALIAS: ${{ secrets.GILBEOT_KEY_ALIAS }}
          GILBEOT_KEY_PASSWORD: ${{ secrets.GILBEOT_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/길벗모니터링-v1.42.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilbeot-monitoring-v1.42-apk
          path: app/build/outputs/apk/release/길벗모니터링-v1.42.apk
          if-no-files-found: error
