name: Build Gilbeot Monitoring APK v1.46

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Gilbeot-project-v1.46.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore Android project v1.46
        run: |
          base64 -d Gilbeot-project-v1.46.txt > project.zip
          unzip -q project.zip
          cp -a gilbeot-monitoring-v1.46/. .

      - name: Verify v1.46 features
        run: |
          grep -q 'versionCode = 146' app/build.gradle.kts
          grep -q 'versionName = "1.46"' app/build.gradle.kts
          grep -q 'const val VERSION = "1.46"' app/src/main/java/com/gilbeot/monitoring/BuildInfo.kt
          grep -q 'SUPABASE_URL' app/build.gradle.kts
          grep -q 'SUPABASE_PUBLISHABLE_KEY' app/build.gradle.kts
          grep -q 'object SupabaseSyncManager' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'provider.*google' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'gilbeot_device_snapshots' app/src/main/java/com/gilbeot/monitoring/sync/SupabaseSyncManager.kt
          grep -q 'gilbeotmonitor' app/src/main/AndroidManifest.xml
          grep -q '기록 삭제' app/src/main/java/com/gilbeot/monitoring/ui/AppScreen.kt
          grep -q 'sync_tombstones' app/src/main/java/com/gilbeot/monitoring/data/LocalStore.kt
          grep -q 'val recentListReliable = recent.size >= 80' app/src/main/java/com/gilbeot/monitoring/monitor/CafeCollector.kt
          ! grep -R -q 'GoogleDriveSyncManager\|DRIVE_APPFOLDER\|appDataFolder' app/src/main/java
          ! grep -R -q '사진작업하는곳\|priorityBoard\|우선게시판' app/src/main/java
          echo 'v1.46 static feature checks passed'

      - name: Check Supabase build configuration
        env:
          GILBEOT_SUPABASE_URL: ${{ secrets.GILBEOT_SUPABASE_URL }}
          GILBEOT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GILBEOT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$GILBEOT_SUPABASE_URL" ] || [ -z "$GILBEOT_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo '::warning::Supabase secrets are missing. APK will build, but Google cloud sync will remain disabled until the two secrets are added and APK is rebuilt.'
          else
            echo 'Supabase configuration found.'
          fi

      - name: Restore permanent signing key
        env:
          GILBEOT_KEYSTORE_BASE64: ${{ secrets.GILBEOT_KEYSTORE_BASE64 }}
          GILBEOT_STORE_PASSWORD: ${{ secrets.GILBEOT_STORE_PASSWORD }}
          GILBEOT_KEY_ALIAS: ${{ secrets.GILBEOT_KEY_ALIAS }}
          GILBEOT_KEY_PASSWORD: ${{ secrets.GILBEOT_KEY_PASSWORD }}
        run: |
          test -n "$GILBEOT_KEYSTORE_BASE64" || (echo "Missing GILBEOT_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$GILBEOT_STORE_PASSWORD" || (echo "Missing GILBEOT_STORE_PASSWORD secret" && exit 1)
          test -n "$GILBEOT_KEY_ALIAS" || (echo "Missing GILBEOT_KEY_ALIAS secret" && exit 1)
          test -n "$GILBEOT_KEY_PASSWORD" || (echo "Missing GILBEOT_KEY_PASSWORD secret" && exit 1)
          echo "$GILBEOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gilbeot-release-key.jks"
          echo "GILBEOT_KEYSTORE_PATH=$RUNNER_TEMP/gilbeot-release-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK v1.46
        env:
          GILBEOT_STORE_PASSWORD: ${{ secrets.GILBEOT_STORE_PASSWORD }}
          GILBEOT_KEY_ALIAS: ${{ secrets.GILBEOT_KEY_ALIAS }}
          GILBEOT_KEY_PASSWORD: ${{ secrets.GILBEOT_KEY_PASSWORD }}
          GILBEOT_SUPABASE_URL: ${{ secrets.GILBEOT_SUPABASE_URL }}
          GILBEOT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GILBEOT_SUPABASE_PUBLISHABLE_KEY }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/길벗모니터링-v1.46.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilbeot-monitoring-v1.46-apk
          path: app/build/outputs/apk/release/길벗모니터링-v1.46.apk
          if-no-files-found: error
